  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {

}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;

  height: 28px;

  padding: 0;

.form-range::-webkit-slider-runnable-track {
  height: 28px;

}

.form-range::-webkit-slider-thumb {

  height: 20px;
  margin-top: 4px;

  border-radius: var(--radius-full);

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);

}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

    [aria-selected=&quot;true&quot;],

.btn:focus-visible {

svg {

  height: auto;

    a.y &lt; b.y + b.height &amp;&amp; a.y + a.height &gt; b.y;

  function roundedRect(box, className, radius = 6) {
    return `&lt;rect class=&quot;${className}&quot; x=&quot;${box.x}&quot; y=&quot;${box.y}&quot; width=&quot;${box.width}&quot; height=&quot;${box.height}&quot; rx=&quot;${radius}&quot; /&gt;`;
  }

  function textAt(x, y, value, className = &quot;cv-note&quot;, anchor = &quot;middle&quot;) {
    return `&lt;text class=&quot;${className}&quot; x=&quot;${x}&quot; y=&quot;${y}&quot; text-anchor=&quot;${anchor}&quot; dominant-baseline=&quot;middle&quot;&gt;${esc(value)}&lt;/text&gt;`;
  }

  function multilineText(box, lines, className = &quot;cv-label-text&quot;) {
    const safeLines = lines.map(esc);
    const spacing = 18;
    const start = box.y + box.height / 2 - ((safeLines.length - 1) * spacing) / 2;
    return safeLines.map((line, index) =&gt;
      textAt(box.x + box.width / 2, start + index * spacing, line, className)
    ).join(&quot;&quot;);
  }

  function viewportMarkup(viewport) {
    return `${roundedRect(viewport, &quot;cv-viewport&quot;, 4)}
      ${textAt(viewport.x + 10, viewport.y + 16, &quot;画布&quot;, &quot;cv-note-muted text-small&quot;, &quot;start&quot;)}`;
  }

  function bodyMarkup(body, label = &quot;当前方框&quot;) {
    return `${roundedRect(body, &quot;cv-body&quot;, 2)}${textAt(body.x + body.width / 2, body.y + body.height / 2, label, &quot;cv-body-label&quot;)}`;
  }

  function labelMarkup(box, lines = [&quot;标签&quot;], className = &quot;cv-label-active&quot;) {
    return `${roundedRect(box, className, 6)}${multilineText(box, lines)}`;
  }

  function failMark(box) {
    const size = 8;
    const cx = box.x + box.width - 11;
    const cy = box.y + 11;
    return `&lt;path class=&quot;cv-fail-mark&quot; d=&quot;M ${cx - size / 2} ${cy - size / 2} L ${cx + size / 2} ${cy + size / 2} M ${cx + size / 2} ${cy - size / 2} L ${cx - size / 2} ${cy + size / 2}&quot; fill=&quot;none&quot; stroke=&quot;var(--destructive)&quot; stroke-width=&quot;2.5&quot; stroke-linecap=&quot;round&quot; /&gt;`;
  }

  function candidateIndex(box, index, active) {
    const cx = box.x - 4;
    const cy = box.y - 4;
    const circleClass = active ? &quot;cv-candidate-index cv-candidate-index-active&quot; : &quot;cv-candidate-index&quot;;
    const textClass = active ? &quot;cv-index-text cv-index-text-active text-small&quot; : &quot;cv-index-text text-small&quot;;
    return `&lt;circle class=&quot;${circleClass}&quot; cx=&quot;${cx}&quot; cy=&quot;${cy}&quot; r=&quot;11&quot; /&gt;${textAt(cx, cy + 0.5, index, textClass)}`;
  }

  function obstacleMarkup(box, short = false) {
    const expanded = rect(box.x - 5, box.y - 5, box.width + 10, box.height + 10);
    return `${roundedRect(expanded, &quot;cv-obstacle&quot;, 2)}${textAt(
      expanded.x + expanded.width / 2,
      expanded.y + expanded.height / 2,
      short ? &quot;障碍&quot; : &quot;其他方框&quot;,
      &quot;cv-obstacle-text text-small&quot;
    )}`;
  }

  function fitToViewport(box, viewport) {
    const x = clamp(box.x, viewport.x, viewport.x + viewport.width - box.width);
    const y = clamp(box.y, viewport.y, viewport.y + viewport.height - box.height);
    return rect(x, y, box.width, box.height);
  }

  function autoGeometry(width, height, edgeScenario) {
    const narrow = width &lt; 500;
    const viewport = rect(narrow ? 16 : 36, 52, width - (narrow ? 32 : 72), height - 78);
    const bodyWidth = narrow ? Math.min(126, viewport.width * 0.4) : 172;
    const bodyHeight = narrow ? 86 : 104;
    const labelWidth = narrow ? 78 : 104;
    const labelHeight = narrow ? 34 : 40;
    const gap = narrow ? 8 : 10;
    const bodyX = viewport.x + viewport.width / 2 - bodyWidth / 2;
    const bodyY = edgeScenario
      ? viewport.y + 8
      : viewport.y + viewport.height / 2 - bodyHeight / 2;
    const body = rect(bodyX, bodyY, bodyWidth, bodyHeight);
    const candidates = [
      rect(body.x + gap, body.y - gap - labelHeight, labelWidth, labelHeight),
      rect(body.x + gap, body.y + body.height + gap, labelWidth, labelHeight),
      rect(body.x - gap - labelWidth, body.y + gap, labelWidth, labelHeight),
      rect(body.x + body.width + gap, body.y + gap, labelWidth, labelHeight),
    ];
    const fallback = rect(body.x + gap, body.y + gap, labelWidth, labelHeight);
    return { viewport, body, candidates, fallback };
  }

  function drawAuto(width, height) {
    const meta = autoMeta[state.auto];
    const geometry = autoGeometry(width, height, meta.edge);
    const { viewport, body, candidates, fallback } = geometry;
    const blocked = new Set(meta.blocked || []);
    const failed = new Set(meta.failed);
    const names = [&quot;上外&quot;, &quot;下外&quot;, &quot;左外&quot;, &quot;右外&quot;];
    let marks = viewportMarkup(viewport);

    for (const index of blocked) {
      marks += obstacleMarkup(candidates[index], width &lt; 500);
    }
    marks += bodyMarkup(body);

    candidates.forEach((candidate, index) =&gt; {
      if (failed.has(index)) {
        marks += roundedRect(candidate, &quot;cv-candidate-failed&quot;, 6);
        marks += failMark(candidate);
        marks += candidateIndex(candidate, index + 1, false);
        marks += textAt(candidate.x + candidate.width / 2, candidate.y + candidate.height + 15, names[index], &quot;cv-obstacle-text text-small&quot;);
      } else if (meta.selected === index) {
        marks += labelMarkup(candidate);
        marks += candidateIndex(candidate, index + 1, true);
        marks += textAt(candidate.x + candidate.width / 2, candidate.y + candidate.height + 15, names[index], &quot;cv-note text-small&quot;);
      } else if (index &gt; meta.selected || meta.selected === 4) {
        marks += roundedRect(candidate, &quot;cv-candidate-ghost&quot;, 6);
        marks += candidateIndex(candidate, index + 1, false);
      }
    });

    if (meta.selected === 4) {
      marks += labelMarkup(fallback);
      marks += textAt(fallback.x + fallback.width / 2, fallback.y + fallback.height + 15, &quot;兜底 · 上内&quot;, &quot;cv-note text-small&quot;);
    }

    if (meta.edge) {
      marks += textAt(candidates[0].x + candidates[0].width / 2, viewport.y - 17, &quot;越过画布边缘&quot;, &quot;cv-obstacle-text text-small&quot;);
    }

    const desc = meta.selected === 4
      ? &quot;四个外侧候选都失败，标签放入当前方框上方内侧。&quot;
      : `依次检查候选后，标签放在${names[meta.selected]}。`;
    return { marks, title: &quot;自动放置候选顺序&quot;, desc, status: meta.status, summary: meta.summary };
  }

  function drawTransform(width, height) {
    const narrow = width &lt; 500;
    const viewport = rect(narrow ? 16 : 36, 52, width - (narrow ? 32 : 72), height - 78);
    const gap = narrow ? 8 : 10;
    let body;
    let raw;
    let actual;
    let marks = viewportMarkup(viewport);
    let title = &quot;移动或缩放后的标签布局&quot;;
    let desc = &quot;保留原标签锚点，只将越界的标签布局框平移到画布内。&quot;;

    if (state.transform === &quot;top&quot;) {
      const labelSize = { width: narrow ? 92 : 118, height: narrow ? 36 : 42 };
      body = rect(viewport.x + viewport.width / 2 - (narrow ? 66 : 90), viewport.y + 8, narrow ? 132 : 180, narrow ? 92 : 112);
      raw = rect(body.x + gap, body.y - gap - labelSize.height, labelSize.width, labelSize.height);
      actual = fitToViewport(raw, viewport);
    } else if (state.transform === &quot;right&quot;) {
      const labelSize = { width: narrow ? 128 : 158, height: narrow ? 36 : 42 };
      body = rect(viewport.x + viewport.width - (narrow ? 104 : 132), viewport.y + viewport.height / 2 - 52, narrow ? 96 : 122, 104);
      raw = rect(body.x + gap, body.y - gap - labelSize.height, labelSize.width, labelSize.height);
      actual = fitToViewport(raw, viewport);
    } else if (state.transform === &quot;obstacle&quot;) {
      const labelSize = { width: narrow ? 92 : 118, height: narrow ? 36 : 42 };
      body = rect(viewport.x + viewport.width / 2 - (narrow ? 66 : 90), viewport.y + viewport.height / 2 - 40, narrow ? 132 : 180, 100);
      raw = rect(body.x + gap, body.y - gap - labelSize.height, labelSize.width, labelSize.height);
      actual = raw;
      marks += obstacleMarkup(rect(raw.x - 12, raw.y - 8, raw.width + 34, raw.height + 18), narrow);
      desc = &quot;标签与其他方框相交，但移动和缩放流程不会重新选择锚点。&quot;;
    } else {
      const labelSize = { width: narrow ? 104 : 136, height: narrow ? 72 : 82 };
      body = rect(viewport.x + viewport.width / 2 - (narrow ? 46 : 56), viewport.y + 26, narrow ? 92 : 112, narrow ? 118 : 132);
      raw = rect(body.x + gap, body.y - gap - labelSize.height, labelSize.width, labelSize.height);
      actual = fitToViewport(raw, viewport);
      desc = &quot;方框变窄后标签重新换行并变高，锚点仍保持上外。&quot;;
    }

    marks += bodyMarkup(body);
    marks += roundedRect(raw, &quot;cv-raw-label&quot;, 6);

    const rawCenter = center(raw);
    const actualCenter = center(actual);
    const moved = Math.abs(rawCenter.x - actualCenter.x) &gt; 0.5 || Math.abs(rawCenter.y - actualCenter.y) &gt; 0.5;
    if (moved) {
      marks += `&lt;line class=&quot;cv-motion-line&quot; x1=&quot;${rawCenter.x}&quot; y1=&quot;${rawCenter.y}&quot; x2=&quot;${actualCenter.x}&quot; y2=&quot;${actualCenter.y}&quot; /&gt;`;
    }

    const lines = state.transform === &quot;wrap&quot; ? [&quot;较长的标签&quot;, &quot;重新换行&quot;] : [&quot;实际标签&quot;];
    marks += labelMarkup(actual, lines);

    const meta = transformMeta[state.transform];
    return { marks, title, desc, status: meta.status, summary: meta.summary };
  }

  function manualCandidates(body, desired, viewport, labelWidth, labelHeight, gap) {
    const horizontal = clamp(
      (desired.x - labelWidth / 2 - body.x - gap) / body.width,
      0,
      1
    );
    const vertical = clamp(
      (desired.y - labelHeight / 2 - body.y - gap) / body.height,
      0,
      1
    );
    const x = body.x + gap + body.width * horizontal;
    const y = body.y + gap + body.height * vertical;
    const definitions = [
      { name: &quot;上外&quot;, edge: &quot;top&quot;, side: &quot;outside&quot;, box: rect(x, body.y - gap - labelHeight, labelWidth, labelHeight) },
      { name: &quot;上内&quot;, edge: &quot;top&quot;, side: &quot;inside&quot;, box: rect(x, body.y + gap, labelWidth, labelHeight) },
      { name: &quot;下内&quot;, edge: &quot;bottom&quot;, side: &quot;inside&quot;, box: rect(x, body.y + body.height - gap - labelHeight, labelWidth, labelHeight) },
      { name: &quot;下外&quot;, edge: &quot;bottom&quot;, side: &quot;outside&quot;, box: rect(x, body.y + body.height + gap, labelWidth, labelHeight) },
      { name: &quot;左外&quot;, edge: &quot;left&quot;, side: &quot;outside&quot;, box: rect(body.x - gap - labelWidth, y, labelWidth, labelHeight) },
      { name: &quot;左内&quot;, edge: &quot;left&quot;, side: &quot;inside&quot;, box: rect(body.x + gap, y, labelWidth, labelHeight) },
      { name: &quot;右内&quot;, edge: &quot;right&quot;, side: &quot;inside&quot;, box: rect(body.x + body.width - gap - labelWidth, y, labelWidth, labelHeight) },
      { name: &quot;右外&quot;, edge: &quot;right&quot;, side: &quot;outside&quot;, box: rect(body.x + body.width + gap, y, labelWidth, labelHeight) },
    ];
    return definitions.map((definition) =&gt; {
      const fitted = fitToViewport(definition.box, viewport);
      const candidateCenter = center(fitted);
      return {
        ...definition,
        box: fitted,
        distance: Math.hypot(candidateCenter.x - desired.x, candidateCenter.y - desired.y),
      };
    });
  }

  function drawManual(width, height) {
    const narrow = width &lt; 500;
    const viewport = rect(narrow ? 16 : 36, 52, width - (narrow ? 32 : 72), height - 78);
    const body = rect(
      viewport.x + viewport.width / 2 - (narrow ? 62 : 90),
      viewport.y + viewport.height / 2 - (narrow ? 45 : 55),
      narrow ? 124 : 180,
      narrow ? 90 : 110
    );
    const desired = {
      x: viewport.x + 12 + (viewport.width - 24) * state.manualX / 100,
      y: viewport.y + 12 + (viewport.height - 24) * state.manualY / 100,
    };
    const labelWidth = narrow ? 80 : 106;
    const labelHeight = narrow ? 34 : 40;
    const gap = narrow ? 8 : 10;
    const candidates = manualCandidates(body, desired, viewport, labelWidth, labelHeight, gap);
    let selected = candidates[0];
    for (const candidate of candidates.slice(1)) {
      if (candidate.distance &lt; selected.distance) selected = candidate;
    }

    const obstacle = rect(
      body.x + body.width + gap + (narrow ? 2 : 8),
      body.y + body.height / 2 - 34,
      narrow ? 74 : 104,
      68
    );
    const collision = intersects(selected.box, obstacle);
    let marks = viewportMarkup(viewport);

    const trackOffset = narrow ? 14 : 18;
    const tracks = [
      { name: &quot;上外&quot;, x1: body.x, y1: body.y - gap - labelHeight / 2, x2: body.x + body.width, y2: body.y - gap - labelHeight / 2 },
      { name: &quot;上内&quot;, x1: body.x, y1: body.y + gap + labelHeight / 2, x2: body.x + body.width, y2: body.y + gap + labelHeight / 2 },
      { name: &quot;下内&quot;, x1: body.x, y1: body.y + body.height - gap - labelHeight / 2, x2: body.x + body.width, y2: body.y + body.height - gap - labelHeight / 2 },
      { name: &quot;下外&quot;, x1: body.x, y1: body.y + body.height + gap + labelHeight / 2, x2: body.x + body.width, y2: body.y + body.height + gap + labelHeight / 2 },
      { name: &quot;左外&quot;, x1: body.x - gap - labelWidth / 2, y1: body.y, x2: body.x - gap - labelWidth / 2, y2: body.y + body.height },
      { name: &quot;左内&quot;, x1: body.x + gap + labelWidth / 2, y1: body.y, x2: body.x + gap + labelWidth / 2, y2: body.y + body.height },
      { name: &quot;右内&quot;, x1: body.x + body.width - gap - labelWidth / 2, y1: body.y, x2: body.x + body.width - gap - labelWidth / 2, y2: body.y + body.height },
      { name: &quot;右外&quot;, x1: body.x + body.width + gap + labelWidth / 2, y1: body.y, x2: body.x + body.width + gap + labelWidth / 2, y2: body.y + body.height },
    ];

    tracks.forEach((track) =&gt; {
      const selectedTrack = track.name === selected.name;
      marks += `&lt;line class=&quot;cv-track${selectedTrack ? &quot; cv-track-selected&quot; : &quot;&quot;}&quot; x1=&quot;${track.x1}&quot; y1=&quot;${track.y1}&quot; x2=&quot;${track.x2}&quot; y2=&quot;${track.y2}&quot; /&gt;`;
    });

    marks += obstacleMarkup(obstacle, narrow);
    marks += bodyMarkup(body);
    marks += `&lt;line class=&quot;cv-target-line&quot; x1=&quot;${desired.x}&quot; y1=&quot;${desired.y}&quot; x2=&quot;${center(selected.box).x}&quot; y2=&quot;${center(selected.box).y}&quot; /&gt;`;
    marks += labelMarkup(selected.box);
    marks += `&lt;circle class=&quot;cv-target-point&quot; cx=&quot;${desired.x}&quot; cy=&quot;${desired.y}&quot; r=&quot;7&quot; /&gt;`;
    marks += textAt(desired.x, desired.y - trackOffset, &quot;目标点&quot;, &quot;cv-note text-small&quot;);
    marks += textAt(center(selected.box).x, selected.box.y + selected.box.height + 16, selected.name, &quot;cv-note text-small&quot;);

    const statusText = collision ? `最近：${selected.name} · 与障碍重叠` : `最近：${selected.name}`;
    const summaryText = collision
      ? &quot;八条轨道只按目标点距离选最近位置；即使与其他方框重叠，也不会换到次近轨道。&quot;
      : &quot;八条轨道只按目标点距离选最近位置；其他方框和标签不参与这次判断。&quot;;
    return {
      marks,
      title: &quot;手动拖动标签的八轨吸附&quot;,
      desc: `目标点最近的轨道是${selected.name}。障碍物不参与距离比较。`,
      status: statusText,
      summary: summaryText,
    };
  }

  function draw() {
    const width = Math.max(320, Math.floor(stage.getBoundingClientRect().width || root.getBoundingClientRect().width || 736));
    const height = width &lt; 500 ? 350 : 390;
    svg.style.height = `${height}px`;
    svg.setAttribute(&quot;viewBox&quot;, `0 0 ${width} ${height}`);

    const result = state.mode === &quot;auto&quot;
      ? drawAuto(width, height)
      : state.mode === &quot;transform&quot;
        ? drawTransform(width, height)
        : drawManual(width, height);

    svg.innerHTML = `&lt;title id=&quot;cv-diagram-title&quot;&gt;${esc(result.title)}&lt;/title&gt;
      &lt;desc id=&quot;cv-diagram-desc&quot;&gt;${esc(result.desc)}&lt;/desc&gt;
      &lt;defs&gt;
        &lt;marker id=&quot;cv-arrowhead&quot; markerWidth=&quot;8&quot; markerHeight=&quot;8&quot; refX=&quot;7&quot; refY=&quot;4&quot; orient=&quot;auto&quot; markerUnits=&quot;strokeWidth&quot;&gt;
          &lt;path d=&quot;M 0 0 L 8 4 L 0 8 Z&quot; fill=&quot;var(--muted-foreground)&quot; /&gt;
        &lt;/marker&gt;
      &lt;/defs&gt;
      ${result.marks}`;
    status.textContent = result.status;
    summary.textContent = result.summary;
  }

  function selectButtons(selector, selected) {
    root.querySelectorAll(selector).forEach((button) =&gt; {
      const active = button === selected;
      button.classList.toggle(&quot;btn-primary&quot;, active);
      if (button.hasAttribute(&quot;aria-pressed&quot;)) button.setAttribute(&quot;aria-pressed&quot;, String(active));
      if (button.hasAttribute(&quot;aria-selected&quot;)) button.setAttribute(&quot;aria-selected&quot;, String(active));
    });
  }

  root.querySelectorAll(&quot;[data-mode]&quot;).forEach((button) =&gt; {
    button.addEventListener(&quot;click&quot;, () =&gt; {
      state.mode = button.dataset.mode;
      selectButtons(&quot;[data-mode]&quot;, button);
      root.querySelectorAll(&quot;[data-controls]&quot;).forEach((group) =&gt; {
        group.hidden = group.dataset.controls !== state.mode;
      });
      root.querySelectorAll(&quot;[data-rule]&quot;).forEach((group) =&gt; {
        group.hidden = group.dataset.rule !== state.mode;
      });
      scope.textContent = modeMeta[state.mode];
      draw();
    });
  });

  root.querySelectorAll(&quot;[data-auto]&quot;).forEach((button) =&gt; {
    button.addEventListener(&quot;click&quot;, () =&gt; {
      state.auto = button.dataset.auto;
      selectButtons(&quot;[data-auto]&quot;, button);
      draw();
    });
  });

  root.querySelectorAll(&quot;[data-transform]&quot;).forEach((button) =&gt; {
    button.addEventListener(&quot;click&quot;, () =&gt; {
      state.transform = button.dataset.transform;
      selectButtons(&quot;[data-transform]&quot;, button);
      draw();
    });
  });

  const updateManual = () =&gt; {
    state.manualX = Number(manualX.value);
    state.manualY = Number(manualY.value);
    manualXValue.textContent = `${state.manualX}%`;
    manualYValue.textContent = `${state.manualY}%`;
    draw();
  };
  manualX.addEventListener(&quot;input&quot;, updateManual);
  manualY.addEventListener(&quot;input&quot;, updateManual);

  const observer = new ResizeObserver(() =&gt; draw());
  observer.observe(stage);
  draw();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {

  }

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)

  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

  const setDescribedBy = (trigger, described) =&gt; {

  };

    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {

    }

    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
