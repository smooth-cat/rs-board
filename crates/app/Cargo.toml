[package]
name = "app"
version.workspace = true
edition.workspace = true

[dependencies]
common.workspace = true
arboard.workspace = true
chrono.workspace = true
directories.workspace = true
eframe.workspace = true
global-hotkey.workspace = true
image.workspace = true
imageproc.workspace = true
ab_glyph.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
single-instance.workspace = true
thiserror.workspace = true
tray-icon.workspace = true
uuid.workspace = true
winit.workspace = true
xcap.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
  "NSApplication",
  "NSPasteboard",
  "NSView",
  "NSWindow",
] }
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-core-foundation = { version = "0.3.2", features = [
  "CFArray",
  "CFData",
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
objc2-core-services = { version = "0.3.2", default-features = false, features = [
  "AE",
  "AEDataModel",
  "AppleEvents",
  "objc2",
] }
objc2-core-graphics = { version = "0.3.2", features = [
  "CGColorSpace",
  "CGEvent",
  "CGGeometry",
  "CGWindow",
] }
objc2-core-media = { version = "0.3.2", default-features = false, features = [
  "CMSampleBuffer",
  "objc2",
  "objc2-core-video",
] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
  "CVBase",
  "CVBuffer",
  "CVImageBuffer",
  "CVPixelBuffer",
  "CVReturn",
] }
objc2-foundation = { version = "0.3.2", features = [
  "NSArray",
  "NSData",
  "NSAppleEventDescriptor",
  "NSAppleEventManager",
  "NSObject",
  "NSString",
  "NSURL",
  "objc2-core-services",
] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = [
  "SCError",
  "SCShareableContent",
  "SCStream",
  "block2",
  "dispatch2",
  "libc",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-core-media",
  "std",
] }
smappservice-rs = "0.1.3"

[package.metadata.bundle]
name = "RS Board"
identifier = "com.linjiajian.rs-board"
category = "public.app-category.productivity"
osx_minimum_system_version = "13.0"
osx_info_plist_exts = ["assets/macos-info-plist-ext.xml"]
copyright = "Copyright (c) 2026 Lin Jiajian"
